        { title: "1) What data we collect", body: ["• Authentication token (JWT): stored locally in the device's encrypted secure storage (Android Keystore / iOS Keychain) to authorize API calls.", "• API data: events, announcements, competitions, payments, people/group information and leaderboards — loaded dynamically from the GraphQL API based on your login.", "• Optional data: if you fill in profile details or change settings in the app, they will be used to improve the user experience.", "• Feedback form: if you send feedback, the name, e-mail and message you enter are sent to the app developer (tobiso.com) solely to handle your feedback.", "• Push notification data: the device's push token and subscriptions to notification topics (e.g. your training group), used to deliver notifications.", "• Technical error reports: when the app encounters an error, it sends a report with the error message, timestamp, stack trace, app version, OS version and device model to the app's feedback service. Reports contain no name, e-mail or account identifier, and tokens, e-mail addresses and long numbers are removed before sending. Because the receiving server sees your IP address, these reports are pseudonymous rather than fully anonymous.", "• No advertising or tracking: Firebase Analytics and Crashlytics are disabled in the app and no advertising identifier is collected.", "• Other members' data: the API may show you names, contact details and birthdays of other club members (e.g. in the people list, calendar and birthday widget), to the extent the club allows. If your account is linked to other people (e.g. a child), you can switch between them.", "• Content you create: if you have trainer or administrator rights, the events and announcements you write are sent to the API.", "• On-device only: achievements/badges and app preferences are computed and stored on your device and are not sent anywhere. Photos of camp schedules are processed on the device (text recognition) and never uploaded."] },
        { title: "2) Where and how data is stored", body: ["• Network requests go to api.rozpisovnik.cz/graphql. The app does not maintain its own central data storage outside the API provider.", "• The JWT is stored in the platform's secure storage. To support offline use, the app also caches events, announcements, people and payment data locally on your device in encrypted (Android) or file-protected (iOS) storage. Device backups of app data are disabled.", "• When you log out, the app deletes the token, user data, the offline cache, scheduled notifications, temporary files (camp-schedule photos, shared images, exported notification settings) and unsubscribes the device from group notification topics."] },
        { title: "3) Purpose of processing and legal basis", body: ["• Providing the app to club members — authentication, displaying your events, payments, competitions and leaderboards, and sending notifications — is based on your club membership (performance of a contract, GDPR art. 6(1)(b)). Where the club must keep records, e.g. for accounting, art. 6(1)(c) applies.", "• Detecting and fixing software errors, keeping the app secure and handling your feedback is based on our legitimate interest in a stable and secure app (art. 6(1)(f)). You can object at any time by turning off error reports in Settings.", "• Push notifications additionally require the notification permission of your device, which you can withdraw at any time in system settings."] },
        { title: "4) Sharing and recipients", body: ["• Data is not sold or shared with third parties for marketing. Recipients are:", "• The API provider and the club (controller of member data) — all data described in section 1 that is loaded from or sent to the API.", "• Google (Firebase Cloud Messaging) — push token and topic subscriptions, used only to deliver push notifications. Google may process data in the USA under the EU–US Data Privacy Framework; see policies.google.com/privacy.", "• tobiso.com (the app developer's feedback service) — feedback form content and technical error reports.", "• GitHub (api.github.com) — when you open the changelog or the app checks for a new version, GitHub receives your IP address and the app's user-agent.", "• Images in announcements are loaded only from tkolymp.cz. Images hosted elsewhere are shown as links and are fetched only if you choose to open them.", "• Google Password Manager: if you choose to save your login on sign-in, the credentials are handed to Google's Credential Manager and stored by Google, not by us.", "• Calendar: “Add to calendar” opens your calendar app through the system; the app does not read your calendar."] },
        { title: "5) Permissions and local access", body: ["The app requires only necessary permissions (e.g. for displaying maps or receiving notifications). We do not access your contacts, photo gallery or other sensitive resources without explicit permission.", "• Camera: taking a photo of a camp schedule uses the system camera; the app only receives the photo you take.", "• Home-screen widgets show data already stored on your device, and the app reschedules reminders after a device restart."] },
        { title: "6) How long we retain data", body: ["The JWT is retained for the token's validity period or until you log out. Locally cached API data and temporary files are removed when you log out. Error reports and feedback are kept only as long as needed to analyse and fix the issue. API-side data is governed by the API provider's and the club's policy."] },
        { title: "7) Your choices", body: ["• Error reports: switch “Send error reports” in Settings → Privacy turns them off (and back on) at any time.", "• Notifications: manage them in the app or in your device's system settings.", "• Logout: removes locally stored personal data from the device."] },
        { title: "8) Your rights", body: ["You have the right to request access to your data, correction, deletion, restriction of processing and data portability, and the right to object to processing based on legitimate interest. For these requests, contact the service administrator or use the API provider's contact channels. You also have the right to lodge a complaint with the Czech Office for Personal Data Protection (ÚOOÚ, uoou.gov.cz)."] },
        { title: "9) Children", body: ["The club trains minors. Their data is processed because of club membership, not on the basis of the child's consent. Parents or legal guardians can exercise a child's rights by contacting the service administrator."] },

        { title: "3) Účel zpracování a právní základ", body: ["• Poskytování aplikace členům klubu — autentizace, zobrazení vašich událostí, plateb, soutěží a žebříčků a zasílání oznámení — vychází z vašeho členství v klubu (plnění smlouvy, čl. 6 odst. 1 písm. b) GDPR). Tam, kde má klub zákonnou povinnost vést evidenci, např. účetní, uplatní se čl. 6 odst. 1 písm. c).", "• Zjišťování a opravy chyb, zabezpečení aplikace a vyřízení vaší zpětné vazby vychází z našeho oprávněného zájmu na stabilní a bezpečné aplikaci (čl. 6 odst. 1 písm. f)). Můžete kdykoli vznést námitku vypnutím chybových zpráv v Nastavení.", "• Push notifikace navíc vyžadují oprávnění k oznámením v zařízení, které můžete kdykoli odvolat v systémovém nastavení."] },

      summaryText: "Die TK-Olymp-App ist ein Client des unter api.rozpisovnik.cz bereitgestellten Dienstes. Wir erheben nur die für den Betrieb der App notwendigen Daten (Authentifizierung, Anzeige von Veranstaltungen, Benachrichtigungen und Profilinformationen). Google Firebase wird ausschließlich zur Zustellung von Push-Benachrichtigungen genutzt; Firebase Analytics und Crashlytics sind deaktiviert. Technische Fehlerberichte können jederzeit unter Einstellungen → Datenschutz ausgeschaltet werden.",
      sections: [

        { title: "3) Zweck der Verarbeitung und Rechtsgrundlage", body: ["• Die Bereitstellung der App für Vereinsmitglieder — Authentifizierung, Anzeige Ihrer Veranstaltungen, Zahlungen, Wettbewerbe und Ranglisten sowie Benachrichtigungen — beruht auf Ihrer Vereinsmitgliedschaft (Vertragserfüllung, Art. 6 Abs. 1 lit. b DSGVO). Soweit der Verein gesetzlich zur Aufbewahrung verpflichtet ist, z. B. in der Buchhaltung, gilt Art. 6 Abs. 1 lit. c.", "• Das Erkennen und Beheben von Softwarefehlern, die Sicherheit der App und die Bearbeitung Ihres Feedbacks beruhen auf unserem berechtigten Interesse an einer stabilen und sicheren App (Art. 6 Abs. 1 lit. f). Sie können jederzeit widersprechen, indem Sie Fehlerberichte in den Einstellungen ausschalten.", "• Push-Benachrichtigungen erfordern zusätzlich die Benachrichtigungsberechtigung Ihres Geräts, die Sie jederzeit in den Systemeinstellungen widerrufen können."] },
        { title: "4) Weitergabe und Empfänger", body: ["• Daten werden nicht verkauft und nicht zu Marketingzwecken an Dritte weitergegeben. Empfänger sind:", "• Der API-Anbieter und der Verein (Verantwortlicher für Mitgliederdaten) — alle in Abschnitt 1 beschriebenen Daten, die aus der API geladen oder an sie gesendet werden.", "• Google (Firebase Cloud Messaging) — Push-Token und Themenabonnements, ausschließlich zur Zustellung von Push-Benachrichtigungen. Google kann Daten in den USA auf Grundlage des EU-US Data Privacy Framework verarbeiten; siehe policies.google.com/privacy.", "• tobiso.com (Feedback-Dienst des App-Entwicklers) — Inhalt des Feedback-Formulars und technische Fehlerberichte.", "• GitHub (api.github.com) — wenn Sie das Änderungsprotokoll öffnen oder die App nach einer neuen Version sucht, erhält GitHub Ihre IP-Adresse und den User-Agent der App.", "• Bilder in Ankündigungen werden nur von tkolymp.cz geladen. Bilder von anderen Servern werden als Links angezeigt und nur abgerufen, wenn Sie sie öffnen.", "• Google Passwort-Manager: Wenn Sie beim Anmelden das Speichern Ihrer Zugangsdaten wählen, werden diese an den Credential Manager von Google übergeben und von Google gespeichert, nicht von uns.", "• Kalender: „Zum Kalender hinzufügen“ öffnet Ihre Kalender-App über das System; die App liest Ihren Kalender nicht."] },
        { title: "5) Berechtigungen und lokaler Zugriff", body: ["Die App benötigt nur notwendige Berechtigungen (z. B. zur Anzeige von Karten oder zum Empfang von Benachrichtigungen). Ohne ausdrückliche Erlaubnis greifen wir nicht auf Ihre Kontakte, Ihre Fotogalerie oder andere sensible Ressourcen zu.", "• Kamera: Für das Foto eines Lagerplans wird die System-Kamera verwendet; die App erhält nur das von Ihnen aufgenommene Foto.", "• Widgets auf dem Startbildschirm zeigen bereits auf Ihrem Gerät gespeicherte Daten an, und die App plant Erinnerungen nach einem Neustart des Geräts neu."] },
        { title: "6) Wie lange wir Daten speichern", body: ["Das JWT wird für die Gültigkeitsdauer des Tokens oder bis zur Abmeldung aufbewahrt. Lokal zwischengespeicherte API-Daten und temporäre Dateien werden bei der Abmeldung entfernt. Fehlerberichte und Feedback werden nur so lange gespeichert, wie es zur Analyse und Behebung des Problems nötig ist. Für Daten auf API-Seite gelten die Richtlinien des API-Anbieters und des Vereins."] },
        { title: "7) Ihre Wahlmöglichkeiten", body: ["• Fehlerberichte: Der Schalter „Fehlerberichte senden“ unter Einstellungen → Datenschutz schaltet sie jederzeit aus (und wieder ein).", "• Benachrichtigungen: Verwalten Sie diese in der App oder in den Systemeinstellungen Ihres Geräts.", "• Abmeldung: entfernt lokal gespeicherte personenbezogene Daten vom Gerät."] },
        { title: "8) Ihre Rechte", body: ["Sie haben das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung und Datenübertragbarkeit sowie das Recht, der auf berechtigtem Interesse beruhenden Verarbeitung zu widersprechen. Wenden Sie sich dafür an den Dienstadministrator oder die Kontaktkanäle des API-Anbieters. Sie haben außerdem das Recht, Beschwerde beim tschechischen Amt für den Schutz personenbezogener Daten (ÚOOÚ, uoou.gov.cz) einzulegen."] },
        { title: "9) Kinder", body: ["Der Verein trainiert Minderjährige. Deren Daten werden aufgrund der Vereinsmitgliedschaft verarbeitet, nicht auf Grundlage einer Einwilligung des Kindes. Eltern oder Erziehungsberechtigte können die Rechte des Kindes über den Dienstadministrator ausüben."] },
        { title: "10) Änderungen der Richtlinie", body: ["Die Richtlinie kann aktualisiert werden. Wir empfehlen, gelegentlich das Gültigkeitsdatum zu prüfen."] },

    sk: {

      summaryTitle: "Stručné zhrnutie",
      summaryText: "Aplikácia TK Olymp je klientom služby poskytovanej na api.rozpisovnik.cz. Zhromažďujeme iba údaje nevyhnutné na prevádzku aplikácie (autentifikácia, zobrazenie udalostí, oznámenia a profilové informácie). Google Firebase používame iba na doručovanie push notifikácií; Firebase Analytics a Crashlytics sú vypnuté. Technické chybové správy možno kedykoľvek vypnúť v Nastaveniach → Súkromie.",
      sections: [
        { title: "1) Aké údaje zhromažďujeme", body: ["• Autentifikačný token (JWT): ukladá sa lokálne v šifrovanom zabezpečenom úložisku zariadenia (Android Keystore / iOS Keychain) na autorizáciu volaní API.", "• Údaje z API: udalosti, oznámenia, súťaže, platby, informácie o ľuďoch/skupinách a rebríčky — načítavajú sa dynamicky z GraphQL API podľa vášho prihlásenia.", "• Voliteľné údaje: ak v aplikácii vyplníte profilové údaje alebo upravíte nastavenia, použijú sa na zlepšenie používateľského zážitku.", "• Formulár spätnej väzby: ak odošlete spätnú väzbu, meno, e-mail a správa, ktoré zadáte, sa odosielajú vývojárovi aplikácie (tobiso.com) výlučne na vybavenie vašej spätnej väzby.", "• Údaje pre push notifikácie: push token zariadenia a odbery tém oznámení (napr. vašej tréningovej skupiny), používané na doručovanie notifikácií.", "• Technické chybové správy: keď aplikácia narazí na chybu, odošle službe spätnej väzby správu s chybovým hlásením, časom, stack trace, verziou aplikácie, verziou OS a modelom zariadenia. Správy neobsahujú meno, e-mail ani identifikátor účtu a tokeny, e-mailové adresy a dlhé čísla sa pred odoslaním odstraňujú. Keďže prijímajúci server vidí vašu IP adresu, tieto správy sú pseudonymné, nie úplne anonymné.", "• Žiadna reklama ani sledovanie: Firebase Analytics a Crashlytics sú v aplikácii vypnuté a nezhromažďuje sa reklamný identifikátor.", "• Údaje ostatných členov: API vám môže zobraziť mená, kontakty a narodeniny ostatných členov klubu (napr. v zozname ľudí, kalendári a widgete narodenín), v rozsahu, ktorý klub povolí. Ak je váš účet prepojený s ďalšími osobami (napr. dieťaťom), môžete medzi nimi prepínať.", "• Obsah, ktorý vytvárate: ak máte práva trénera alebo administrátora, udalosti a oznámenia, ktoré napíšete, sa odosielajú do API.", "• Iba v zariadení: úspechy/odznaky a predvoľby aplikácie sa počítajú a ukladajú vo vašom zariadení a nikam sa neodosielajú. Fotografie rozpisu sústredenia sa spracúvajú v zariadení (rozpoznávanie textu) a nikdy sa nenahrávajú."] },
        { title: "2) Kde a ako sú údaje uložené", body: ["• Sieťové požiadavky smerujú na api.rozpisovnik.cz/graphql. Aplikácia nevytvára vlastné centrálne úložisko údajov mimo poskytovateľa API.", "• JWT je uložený v zabezpečenom úložisku platformy. Na podporu offline používania aplikácia tiež ukladá lokálne do zariadenia udalosti, oznámenia, osoby a platby v šifrovanom (Android) alebo súborovo chránenom (iOS) úložisku. Zálohovanie údajov aplikácie je vypnuté.", "• Pri odhlásení aplikácia zmaže token, používateľské údaje, offline cache, naplánované oznámenia, dočasné súbory (fotografie rozpisu sústredenia, zdieľané obrázky, exportované nastavenia oznámení) a zruší odber tém oznámení skupín."] },
        { title: "3) Účel spracovania a právny základ", body: ["• Poskytovanie aplikácie členom klubu — autentifikácia, zobrazenie vašich udalostí, platieb, súťaží a rebríčkov a zasielanie oznámení — vychádza z vášho členstva v klube (plnenie zmluvy, čl. 6 ods. 1 písm. b) GDPR). Tam, kde má klub zákonnú povinnosť viesť evidenciu, napr. účtovnú, uplatní sa čl. 6 ods. 1 písm. c).", "• Zisťovanie a oprava chýb, zabezpečenie aplikácie a vybavenie vašej spätnej väzby vychádza z nášho oprávneného záujmu na stabilnej a bezpečnej aplikácii (čl. 6 ods. 1 písm. f)). Kedykoľvek môžete namietať vypnutím chybových správ v Nastaveniach.", "• Push notifikácie navyše vyžadujú povolenie oznámení v zariadení, ktoré môžete kedykoľvek odvolať v systémových nastaveniach."] },
        { title: "4) Zdieľanie a príjemcovia", body: ["• Údaje nepredávame ani nezdieľame s tretími stranami na marketing. Príjemcovia sú:", "• Poskytovateľ API a klub (prevádzkovateľ údajov členov) — všetky údaje opísané v oddiele 1, ktoré sa z API načítavajú alebo sa do neho odosielajú.", "• Google (Firebase Cloud Messaging) — push token a odbery tém, používané iba na doručovanie push notifikácií. Google môže údaje spracúvať v USA na základe rámca EU–US Data Privacy Framework; pozri policies.google.com/privacy.", "• tobiso.com (služba spätnej väzby vývojára aplikácie) — obsah formulára spätnej väzby a technické chybové správy.", "• GitHub (api.github.com) — keď otvoríte zoznam zmien alebo aplikácia zisťuje novú verziu, GitHub získa vašu IP adresu a user-agent aplikácie.", "• Obrázky v oznámeniach sa načítavajú iba z tkolymp.cz. Obrázky z iných webov sa zobrazia ako odkazy a stiahnu sa, len keď sa rozhodnete ich otvoriť.", "• Správca hesiel Google: ak sa pri prihlásení rozhodnete uložiť prihlasovacie údaje, odovzdajú sa Správcovi poverení Google a uloží ich Google, nie my.", "• Kalendár: „Pridať do kalendára“ otvorí vašu aplikáciu kalendára cez systém; aplikácia váš kalendár nečíta."] },
        { title: "5) Oprávnenia a lokálny prístup", body: ["Aplikácia vyžaduje len nevyhnutné oprávnenia (napr. na zobrazovanie máp alebo príjem notifikácií). Bez výslovného povolenia nepristupujeme k vašim kontaktom, fotogalériám ani iným citlivým zdrojom.", "• Fotoaparát: odfotenie rozpisu sústredenia využíva systémový fotoaparát; aplikácia dostane iba fotografiu, ktorú urobíte.", "• Widgety na domovskej obrazovke zobrazujú údaje už uložené vo vašom zariadení a aplikácia po reštarte zariadenia znova naplánuje pripomienky."] },
        { title: "6) Ako dlho údaje uchovávame", body: ["JWT sa uchováva počas platnosti tokenu alebo kým sa neodhlásite. Lokálne uložené údaje z API a dočasné súbory sa odstránia pri odhlásení. Chybové správy a spätná väzba sa uchovávajú len po dobu nevyhnutnú na analýzu a opravu problému. Údaje na strane API sa riadia politikou poskytovateľa API a klubu."] },
        { title: "7) Vaše možnosti", body: ["• Chybové správy: prepínač „Odosielať chybové hlásenia“ v Nastaveniach → Súkromie ich kedykoľvek vypne (a znova zapne).", "• Oznámenia: spravujete ich v aplikácii alebo v systémových nastaveniach zariadenia.", "• Odhlásenie: odstráni zo zariadenia lokálne uložené osobné údaje."] },
        { title: "8) Vaše práva", body: ["Máte právo požadovať prístup k svojim údajom, ich opravu, vymazanie, obmedzenie spracovania a prenosnosť a právo namietať proti spracovaniu založenému na oprávnenom záujme. Pre tieto požiadavky kontaktujte správcu služby alebo použite kontaktné kanály poskytovateľa API. Máte tiež právo podať sťažnosť českému Úradu na ochranu osobných údajov (ÚOOÚ, uoou.gov.cz)."] },
        { title: "9) Deti", body: ["Klub trénuje maloletých. Ich údaje sa spracúvajú kvôli členstvu v klube, nie na základe súhlasu dieťaťa. Rodičia alebo zákonní zástupcovia môžu práva dieťaťa uplatniť kontaktovaním správcu služby."] },
        { title: "10) Zmeny zásad", body: ["Zásady môžu byť aktualizované. Odporúčame občas skontrolovať dátum účinnosti."] },

    sl: {
      pageTitle: "Politika zasebnosti",

      summaryTitle: "Kratki povzetek",
      summaryText: "Aplikacija TK Olymp je odjemalec storitve, ki jo zagotavlja api.rozpisovnik.cz. Zbiramo samo podatke, ki so nujni za delovanje aplikacije (prijava, prikaz dogodkov, obvestila in podatki profila). Google Firebase uporabljamo samo za dostavo potisnih obvestil; Firebase Analytics in Crashlytics sta izklopljena. Tehnična poročila o napakah lahko kadar koli izklopite v Nastavitve → Zasebnost.",
      sections: [
        { title: "1) Katere podatke zbiramo", body: ["• Prijavni žeton (JWT): shranjen lokalno v šifriranem varnem pomnilniku naprave (Android Keystore / iOS Keychain) za avtorizacijo klicev API.", "• Podatki iz API: dogodki, obvestila, tekmovanja, plačila, podatki o osebah/skupinah in lestvice — dinamično se nalagajo iz GraphQL API glede na vašo prijavo.", "• Izbirni podatki: če v aplikaciji izpolnite podatke profila ali spremenite nastavitve, se uporabijo za izboljšanje uporabniške izkušnje.", "• Obrazec za povratne informacije: če pošljete povratno informacijo, se vneseno ime, e-pošta in sporočilo pošljejo razvijalcu aplikacije (tobiso.com) izključno za obravnavo vaše povratne informacije.", "• Podatki za potisna obvestila: potisni žeton naprave in naročnine na teme obvestil (npr. vaša trening skupina), ki se uporabljajo za dostavo obvestil.", "• Tehnična poročila o napakah: ko aplikacija naleti na napako, storitvi za povratne informacije pošlje poročilo s sporočilom o napaki, časovnim žigom, sledjo sklada, različico aplikacije, različico OS in modelom naprave. Poročila ne vsebujejo imena, e-pošte ali identifikatorja računa, žetoni, e-poštni naslovi in dolge številke pa se pred pošiljanjem odstranijo. Ker prejemni strežnik vidi vaš naslov IP, so poročila psevdonimna in ne povsem anonimna.", "• Brez oglaševanja in sledenja: Firebase Analytics in Crashlytics sta v aplikaciji izklopljena, oglaševalski identifikator se ne zbira.", "• Podatki drugih članov: API vam lahko prikaže imena, kontakte in rojstne dneve drugih članov kluba (npr. v seznamu oseb, koledarju in pripomočku za rojstne dneve) v obsegu, ki ga klub dovoli. Če je vaš račun povezan z drugimi osebami (npr. otrokom), lahko preklapljate med njimi.", "• Vsebina, ki jo ustvarite: če imate pravice trenerja ali skrbnika, se dogodki in obvestila, ki jih napišete, pošljejo v API.", "• Samo na napravi: dosežki/značke in nastavitve aplikacije se izračunajo in shranijo na vaši napravi ter se nikamor ne pošiljajo. Fotografije urnika tabora se obdelajo na napravi (prepoznavanje besedila) in se nikoli ne naložijo."] },
        { title: "2) Kje in kako so podatki shranjeni", body: ["• Omrežne zahteve gredo na api.rozpisovnik.cz/graphql. Aplikacija ne vzdržuje lastnega osrednjega shranjevanja podatkov zunaj ponudnika API.", "• JWT je shranjen v varnem pomnilniku platforme. Za delovanje brez povezave aplikacija na napravi lokalno shranjuje tudi dogodke, obvestila, osebe in plačila v šifriranem (Android) oziroma datotečno zaščitenem (iOS) pomnilniku. Varnostno kopiranje podatkov aplikacije je izklopljeno.", "• Ob odjavi aplikacija izbriše žeton, uporabniške podatke, predpomnilnik za delo brez povezave, načrtovana obvestila in začasne datoteke (fotografije urnika tabora, deljene slike, izvožene nastavitve obvestil) ter odjavi napravo od tem obvestil skupin."] },
        { title: "3) Namen obdelave in pravna podlaga", body: ["• Zagotavljanje aplikacije članom kluba — prijava, prikaz vaših dogodkov, plačil, tekmovanj in lestvic ter pošiljanje obvestil — temelji na vašem članstvu v klubu (izvajanje pogodbe, člen 6(1)(b) GDPR). Kjer mora klub voditi evidence, npr. računovodske, velja člen 6(1)(c).", "• Odkrivanje in odpravljanje napak, varnost aplikacije in obravnava vaše povratne informacije temeljijo na našem zakonitem interesu za stabilno in varno aplikacijo (člen 6(1)(f)). Kadar koli lahko ugovarjate, če v Nastavitvah izklopite poročila o napakah.", "• Potisna obvestila poleg tega zahtevajo dovoljenje za obvestila na napravi, ki ga lahko kadar koli prekličete v sistemskih nastavitvah."] },
        { title: "4) Deljenje in prejemniki", body: ["• Podatkov ne prodajamo in jih ne delimo s tretjimi osebami za trženje. Prejemniki so:", "• Ponudnik API in klub (upravljavec podatkov članov) — vsi podatki iz razdelka 1, ki se nalagajo iz API ali pošiljajo vanj.", "• Google (Firebase Cloud Messaging) — potisni žeton in naročnine na teme, uporabljeni samo za dostavo potisnih obvestil. Google lahko podatke obdeluje v ZDA na podlagi okvira EU–US Data Privacy Framework; glejte policies.google.com/privacy.", "• tobiso.com (storitev povratnih informacij razvijalca aplikacije) — vsebina obrazca za povratne informacije in tehnična poročila o napakah.", "• GitHub (api.github.com) — ko odprete dnevnik sprememb ali aplikacija preveri novo različico, GitHub prejme vaš naslov IP in user-agent aplikacije.", "• Slike v obvestilih se nalagajo samo s tkolymp.cz. Slike z drugih strani so prikazane kot povezave in se prenesejo samo, če jih odprete.", "• Google Upravitelj gesel: če ob prijavi izberete shranjevanje prijavnih podatkov, se ti predajo Googlovemu upravitelju poverilnic in jih shrani Google, ne mi.", "• Koledar: »Dodaj v koledar« odpre vašo aplikacijo koledarja prek sistema; aplikacija ne bere vašega koledarja."] },
        { title: "5) Dovoljenja in lokalni dostop", body: ["Aplikacija zahteva samo nujna dovoljenja (npr. za prikaz zemljevidov ali prejemanje obvestil). Brez izrecnega dovoljenja ne dostopamo do vaših stikov, galerije fotografij ali drugih občutljivih virov.", "• Kamera: za fotografijo urnika tabora se uporabi sistemska kamera; aplikacija prejme samo fotografijo, ki jo posnamete.", "• Pripomočki na začetnem zaslonu prikazujejo podatke, ki so že shranjeni na vaši napravi, aplikacija pa po ponovnem zagonu naprave znova načrtuje opomnike."] },
        { title: "6) Kako dolgo hranimo podatke", body: ["JWT se hrani za čas veljavnosti žetona ali do odjave. Lokalno shranjeni podatki iz API in začasne datoteke se ob odjavi odstranijo. Poročila o napakah in povratne informacije se hranijo samo toliko časa, kot je potrebno za analizo in odpravo težave. Za podatke na strani API veljajo pravila ponudnika API in kluba."] },
        { title: "7) Vaše izbire", body: ["• Poročila o napakah: stikalo »Pošiljaj poročila o napakah« v Nastavitve → Zasebnost jih kadar koli izklopi (in znova vklopi).", "• Obvestila: upravljate jih v aplikaciji ali v sistemskih nastavitvah naprave.", "• Odjava: iz naprave odstrani lokalno shranjene osebne podatke."] },
        { title: "8) Vaše pravice", body: ["Imate pravico do dostopa do svojih podatkov, popravka, izbrisa, omejitve obdelave in prenosljivosti ter pravico do ugovora zoper obdelavo, ki temelji na zakonitem interesu. Za to se obrnite na skrbnika storitve ali uporabite kontaktne kanale ponudnika API. Imate tudi pravico do pritožbe pri češkem Uradu za varstvo osebnih podatkov (ÚOOÚ, uoou.gov.cz)."] },
        { title: "9) Otroci", body: ["Klub trenira mladoletnike. Njihovi podatki se obdelujejo zaradi članstva v klubu, ne na podlagi otrokove privolitve. Starši ali zakoniti zastopniki lahko pravice otroka uveljavljajo prek skrbnika storitve."] },
        { title: "10) Spremembe politike", body: ["Politika se lahko posodobi. Priporočamo, da občasno preverite datum veljavnosti."] },

    uk: {
      pageTitle: "Політика конфіденційності",

      summaryTitle: "Короткий підсумок",
      summaryText: "Додаток TK Olymp є клієнтом сервісу, що надається на api.rozpisovnik.cz. Ми збираємо лише дані, необхідні для роботи додатку (автентифікація, відображення подій, сповіщення та інформація профілю). Google Firebase використовується лише для доставки push-сповіщень; Firebase Analytics і Crashlytics вимкнено. Технічні звіти про помилки можна будь-коли вимкнути в Налаштування → Конфіденційність.",
      sections: [
        { title: "1) Які дані ми збираємо", body: ["• Токен автентифікації (JWT): зберігається локально в зашифрованому захищеному сховищі пристрою (Android Keystore / iOS Keychain) для авторизації викликів API.", "• Дані з API: події, оголошення, змагання, платежі, інформація про людей/групи та рейтинги — завантажуються динамічно з GraphQL API відповідно до вашого входу.", "• Необов'язкові дані: якщо ви заповнюєте дані профілю або змінюєте налаштування в додатку, вони використовуються для покращення користувацького досвіду.", "• Форма зворотного зв'язку: якщо ви надсилаєте відгук, введені ім'я, e-mail і повідомлення надсилаються розробнику додатку (tobiso.com) виключно для опрацювання вашого відгуку.", "• Дані push-сповіщень: push-токен пристрою та підписки на теми сповіщень (наприклад, вашої тренувальної групи) для доставки сповіщень.", "• Технічні звіти про помилки: коли в додатку виникає помилка, він надсилає службі зворотного зв'язку звіт із повідомленням про помилку, часовою міткою, стеком викликів, версією додатку, версією ОС і моделлю пристрою. Звіти не містять імені, e-mail чи ідентифікатора облікового запису, а токени, e-mail адреси та довгі числа видаляються перед надсиланням. Оскільки сервер-отримувач бачить вашу IP-адресу, ці звіти є псевдонімізованими, а не повністю анонімними.", "• Жодної реклами чи відстеження: Firebase Analytics і Crashlytics у додатку вимкнено, рекламний ідентифікатор не збирається.", "• Дані інших членів: API може показувати вам імена, контакти та дні народження інших членів клубу (наприклад, у списку людей, календарі та віджеті днів народження) в межах, дозволених клубом. Якщо ваш обліковий запис пов'язано з іншими особами (наприклад, дитиною), ви можете перемикатися між ними.", "• Створений вами вміст: якщо ви маєте права тренера чи адміністратора, події та оголошення, які ви пишете, надсилаються до API.", "• Лише на пристрої: досягнення/значки та налаштування додатку обчислюються і зберігаються на вашому пристрої та нікуди не надсилаються. Фото розкладу табору обробляються на пристрої (розпізнавання тексту) і ніколи не завантажуються."] },
        { title: "2) Де і як зберігаються дані", body: ["• Мережеві запити надходять на api.rozpisovnik.cz/graphql. Додаток не веде власного центрального сховища даних поза постачальником API.", "• JWT зберігається в захищеному сховищі платформи. Для офлайн-використання додаток також локально кешує на пристрої події, оголошення, людей і платежі у зашифрованому (Android) або захищеному на рівні файлів (iOS) сховищі. Резервне копіювання даних додатку вимкнено.", "• Під час виходу додаток видаляє токен, дані користувача, офлайн-кеш, заплановані сповіщення та тимчасові файли (фото розкладу табору, спільні зображення, експортовані налаштування сповіщень) і скасовує підписку пристрою на теми сповіщень груп."] },
        { title: "3) Мета обробки та правова підстава", body: ["• Надання додатку членам клубу — автентифікація, відображення ваших подій, платежів, змагань і рейтингів та надсилання сповіщень — ґрунтується на вашому членстві в клубі (виконання договору, ст. 6(1)(b) GDPR). Там, де клуб зобов'язаний вести облік, наприклад бухгалтерський, застосовується ст. 6(1)(c).", "• Виявлення та виправлення помилок, безпека додатку й опрацювання вашого відгуку ґрунтуються на нашому законному інтересі у стабільному та безпечному додатку (ст. 6(1)(f)). Ви можете в будь-який час заперечити, вимкнувши звіти про помилки в Налаштуваннях.", "• Push-сповіщення додатково потребують дозволу на сповіщення на вашому пристрої, який ви можете скасувати в будь-який час у налаштуваннях системи."] },
        { title: "4) Передача даних і одержувачі", body: ["• Дані не продаються і не передаються третім сторонам для маркетингу. Одержувачі:", "• Постачальник API та клуб (контролер даних членів) — усі дані, описані в розділі 1, що завантажуються з API або надсилаються до нього.", "• Google (Firebase Cloud Messaging) — push-токен і підписки на теми, що використовуються лише для доставки push-сповіщень. Google може обробляти дані в США на основі EU–US Data Privacy Framework; див. policies.google.com/privacy.", "• tobiso.com (служба зворотного зв'язку розробника додатку) — вміст форми зворотного зв'язку та технічні звіти про помилки.", "• GitHub (api.github.com) — коли ви відкриваєте журнал змін або додаток перевіряє нову версію, GitHub отримує вашу IP-адресу та user-agent додатку.", "• Зображення в оголошеннях завантажуються лише з tkolymp.cz. Зображення з інших сайтів показуються як посилання і завантажуються, лише якщо ви вирішите їх відкрити.", "• Менеджер паролів Google: якщо під час входу ви вирішите зберегти дані для входу, їх буде передано Credential Manager від Google, і зберігає їх Google, а не ми.", "• Календар: «Додати до календаря» відкриває ваш додаток календаря через систему; додаток не читає ваш календар."] },
        { title: "5) Дозволи та локальний доступ", body: ["Додаток вимагає лише необхідних дозволів (наприклад, для відображення карт або отримання сповіщень). Ми не отримуємо доступу до ваших контактів, галереї фото чи інших чутливих ресурсів без явного дозволу.", "• Камера: для фото розкладу табору використовується системна камера; додаток отримує лише зроблене вами фото.", "• Віджети на головному екрані показують дані, вже збережені на вашому пристрої, а після перезапуску пристрою додаток заново планує нагадування."] },
        { title: "6) Як довго ми зберігаємо дані", body: ["JWT зберігається протягом терміну дії токена або до виходу. Локально кешовані дані API та тимчасові файли видаляються під час виходу. Звіти про помилки та відгуки зберігаються лише стільки, скільки потрібно для аналізу й виправлення проблеми. Дані на стороні API регулюються політикою постачальника API та клубу."] },
        { title: "7) Ваш вибір", body: ["• Звіти про помилки: перемикач «Надсилати звіти про помилки» в Налаштування → Конфіденційність вимикає їх (і вмикає знову) у будь-який час.", "• Сповіщення: керуйте ними в додатку або в системних налаштуваннях пристрою.", "• Вихід: видаляє з пристрою локально збережені персональні дані."] },
        { title: "8) Ваші права", body: ["Ви маєте право на доступ до своїх даних, їх виправлення, видалення, обмеження обробки та перенесення, а також право заперечувати проти обробки на основі законного інтересу. Для цього зверніться до адміністратора сервісу або скористайтеся контактними каналами постачальника API. Ви також маєте право подати скаргу до чеського Управління із захисту персональних даних (ÚOOÚ, uoou.gov.cz)."] },
        { title: "9) Діти", body: ["Клуб тренує неповнолітніх. Їхні дані обробляються через членство в клубі, а не на підставі згоди дитини. Батьки або законні представники можуть реалізувати права дитини, звернувшись до адміністратора сервісу."] },
        { title: "10) Зміни політики", body: ["Політика може оновлюватися. Рекомендуємо час від часу перевіряти дату набрання чинності."] },
      ],
      contactTitle: "Контакт",
      contactText: "Якщо у вас є питання щодо захисту даних або запит на видалення, зверніться до адміністратора сервісу: tkolymp.cz/kontakt",
      technicalNote: "Технічні деталі: реалізацію автентифікації та виклики GraphQL можна знайти в AuthService та EventServices. Сповіщеннями керують NotificationManagerService та Firebase Cloud Messaging. Кешуванням для роботи без інтернету керують OfflineSyncManager та OfflineDataStorage.",
      breadcrumbHome: "Головна",
    },
    vi: {
      pageTitle: "Chính sách bảo mật",
      effectiveDate: "Ngày có hiệu lực: 5 tháng 11 năm 2026",
      summaryTitle: "Tóm tắt ngắn gọn",
      summaryText: "Ứng dụng TK Olymp là ứng dụng khách của dịch vụ cung cấp tại api.rozpisovnik.cz. Chúng tôi chỉ thu thập dữ liệu cần thiết để vận hành ứng dụng (xác thực, hiển thị sự kiện, thông báo và thông tin hồ sơ). Google Firebase chỉ được dùng để gửi thông báo đẩy; Firebase Analytics và Crashlytics đã bị tắt. Bạn có thể tắt báo cáo lỗi kỹ thuật bất cứ lúc nào trong Cài đặt → Quyền riêng tư.",
      sections: [
        { title: "1) Chúng tôi thu thập những dữ liệu nào", body: ["• Mã xác thực (JWT): được lưu cục bộ trong bộ nhớ an toàn đã mã hóa của thiết bị (Android Keystore / iOS Keychain) để ủy quyền các lệnh gọi API.", "• Dữ liệu API: sự kiện, thông báo, giải đấu, thanh toán, thông tin người/nhóm và bảng xếp hạng — được tải động từ GraphQL API theo tài khoản đăng nhập của bạn.", "• Dữ liệu tùy chọn: nếu bạn điền thông tin hồ sơ hoặc thay đổi cài đặt trong ứng dụng, chúng sẽ được dùng để cải thiện trải nghiệm người dùng.", "• Biểu mẫu phản hồi: nếu bạn gửi phản hồi, tên, e-mail và nội dung bạn nhập sẽ được gửi đến nhà phát triển ứng dụng (tobiso.com) chỉ để xử lý phản hồi của bạn.", "• Dữ liệu thông báo đẩy: mã đẩy (push token) của thiết bị và các đăng ký chủ đề thông báo (ví dụ nhóm tập luyện của bạn), dùng để gửi thông báo.", "• Báo cáo lỗi kỹ thuật: khi ứng dụng gặp lỗi, nó gửi báo cáo gồm thông báo lỗi, dấu thời gian, stack trace, phiên bản ứng dụng, phiên bản hệ điều hành và mẫu thiết bị đến dịch vụ phản hồi của ứng dụng. Báo cáo không chứa tên, e-mail hay mã định danh tài khoản; mã thông báo, địa chỉ e-mail và các số dài được loại bỏ trước khi gửi. Vì máy chủ nhận thấy địa chỉ IP của bạn nên các báo cáo này là dữ liệu giả danh, không hoàn toàn ẩn danh.", "• Không quảng cáo, không theo dõi: Firebase Analytics và Crashlytics bị tắt trong ứng dụng và không thu thập mã định danh quảng cáo.", "• Dữ liệu của thành viên khác: API có thể hiển thị cho bạn tên, thông tin liên hệ và ngày sinh của các thành viên khác trong câu lạc bộ (ví dụ trong danh sách người, lịch và tiện ích sinh nhật), trong phạm vi câu lạc bộ cho phép. Nếu tài khoản của bạn được liên kết với người khác (ví dụ con bạn), bạn có thể chuyển đổi giữa họ.", "• Nội dung bạn tạo: nếu bạn có quyền huấn luyện viên hoặc quản trị viên, các sự kiện và thông báo bạn soạn sẽ được gửi đến API.", "• Chỉ trên thiết bị: thành tích/huy hiệu và tùy chọn ứng dụng được tính toán và lưu trên thiết bị của bạn và không gửi đi đâu. Ảnh lịch trại được xử lý trên thiết bị (nhận dạng văn bản) và không bao giờ được tải lên."] },
        { title: "2) Dữ liệu được lưu ở đâu và như thế nào", body: ["• Các yêu cầu mạng được gửi đến api.rozpisovnik.cz/graphql. Ứng dụng không duy trì kho dữ liệu trung tâm riêng ngoài nhà cung cấp API.", "• JWT được lưu trong bộ nhớ an toàn của nền tảng. Để hỗ trợ sử dụng ngoại tuyến, ứng dụng cũng lưu đệm cục bộ sự kiện, thông báo, thông tin người và thanh toán trên thiết bị trong bộ nhớ được mã hóa (Android) hoặc bảo vệ ở cấp tệp (iOS). Sao lưu dữ liệu ứng dụng bị tắt.", "• Khi bạn đăng xuất, ứng dụng xóa mã thông báo, dữ liệu người dùng, bộ nhớ đệm ngoại tuyến, thông báo đã lên lịch và các tệp tạm (ảnh lịch trại, ảnh chia sẻ, cài đặt thông báo đã xuất), đồng thời hủy đăng ký thiết bị khỏi các chủ đề thông báo của nhóm."] },
        { title: "3) Mục đích xử lý và cơ sở pháp lý", body: ["• Việc cung cấp ứng dụng cho thành viên câu lạc bộ — xác thực, hiển thị sự kiện, thanh toán, giải đấu và bảng xếp hạng, cũng như gửi thông báo — dựa trên tư cách thành viên của bạn (thực hiện hợp đồng, Điều 6(1)(b) GDPR). Khi câu lạc bộ có nghĩa vụ pháp lý phải lưu hồ sơ, ví dụ kế toán, áp dụng Điều 6(1)(c).", "• Việc phát hiện và sửa lỗi phần mềm, bảo mật ứng dụng và xử lý phản hồi của bạn dựa trên lợi ích hợp pháp của chúng tôi trong việc duy trì một ứng dụng ổn định và an toàn (Điều 6(1)(f)). Bạn có thể phản đối bất cứ lúc nào bằng cách tắt báo cáo lỗi trong Cài đặt.", "• Thông báo đẩy còn yêu cầu quyền thông báo của thiết bị, bạn có thể thu hồi bất cứ lúc nào trong cài đặt hệ thống."] },
        { title: "4) Chia sẻ và bên nhận dữ liệu", body: ["• Dữ liệu không được bán hoặc chia sẻ với bên thứ ba cho mục đích tiếp thị. Các bên nhận gồm:", "• Nhà cung cấp API và câu lạc bộ (bên kiểm soát dữ liệu thành viên) — mọi dữ liệu nêu ở mục 1 được tải từ hoặc gửi đến API.", "• Google (Firebase Cloud Messaging) — push token và đăng ký chủ đề, chỉ dùng để gửi thông báo đẩy. Google có thể xử lý dữ liệu tại Hoa Kỳ theo khung EU–US Data Privacy Framework; xem policies.google.com/privacy.", "• tobiso.com (dịch vụ phản hồi của nhà phát triển ứng dụng) — nội dung biểu mẫu phản hồi và báo cáo lỗi kỹ thuật.", "• GitHub (api.github.com) — khi bạn mở nhật ký thay đổi hoặc ứng dụng kiểm tra phiên bản mới, GitHub nhận địa chỉ IP của bạn và user-agent của ứng dụng.", "• Hình ảnh trong thông báo chỉ được tải từ tkolymp.cz. Hình ảnh từ trang khác được hiển thị dưới dạng liên kết và chỉ được tải khi bạn chọn mở.", "• Trình quản lý mật khẩu của Google: nếu bạn chọn lưu thông tin đăng nhập khi đăng nhập, thông tin đó được chuyển cho Credential Manager của Google và do Google lưu, không phải chúng tôi.", "• Lịch: “Thêm vào lịch” mở ứng dụng lịch của bạn thông qua hệ thống; ứng dụng không đọc lịch của bạn."] },
        { title: "5) Quyền và truy cập cục bộ", body: ["Ứng dụng chỉ yêu cầu các quyền cần thiết (ví dụ để hiển thị bản đồ hoặc nhận thông báo). Chúng tôi không truy cập danh bạ, thư viện ảnh hay các tài nguyên nhạy cảm khác của bạn nếu không có sự cho phép rõ ràng.", "• Máy ảnh: chụp ảnh lịch trại dùng máy ảnh của hệ thống; ứng dụng chỉ nhận ảnh bạn chụp.", "• Tiện ích trên màn hình chính hiển thị dữ liệu đã lưu trên thiết bị của bạn, và ứng dụng lên lịch lại nhắc nhở sau khi thiết bị khởi động lại."] },
        { title: "6) Chúng tôi lưu giữ dữ liệu trong bao lâu", body: ["JWT được giữ trong thời hạn hiệu lực của mã hoặc đến khi bạn đăng xuất. Dữ liệu API lưu đệm cục bộ và các tệp tạm bị xóa khi bạn đăng xuất. Báo cáo lỗi và phản hồi chỉ được giữ trong thời gian cần thiết để phân tích và khắc phục sự cố. Dữ liệu phía API tuân theo chính sách của nhà cung cấp API và câu lạc bộ."] },
        { title: "7) Lựa chọn của bạn", body: ["• Báo cáo lỗi: công tắc “Gửi báo cáo lỗi” trong Cài đặt → Quyền riêng tư tắt (và bật lại) chúng bất cứ lúc nào.", "• Thông báo: quản lý trong ứng dụng hoặc trong cài đặt hệ thống của thiết bị.", "• Đăng xuất: xóa dữ liệu cá nhân lưu cục bộ khỏi thiết bị."] },
        { title: "8) Quyền của bạn", body: ["Bạn có quyền yêu cầu truy cập, chỉnh sửa, xóa, hạn chế xử lý và di chuyển dữ liệu, cũng như quyền phản đối việc xử lý dựa trên lợi ích hợp pháp. Để thực hiện, hãy liên hệ quản trị viên dịch vụ hoặc dùng các kênh liên hệ của nhà cung cấp API. Bạn cũng có quyền khiếu nại với Cơ quan Bảo vệ Dữ liệu Cá nhân Cộng hòa Séc (ÚOOÚ, uoou.gov.cz)."] },
        { title: "9) Trẻ em", body: ["Câu lạc bộ huấn luyện trẻ vị thành niên. Dữ liệu của các em được xử lý vì tư cách thành viên câu lạc bộ, không dựa trên sự đồng ý của trẻ. Cha mẹ hoặc người giám hộ hợp pháp có thể thực hiện quyền của trẻ bằng cách liên hệ quản trị viên dịch vụ."] },
        { title: "10) Thay đổi chính sách", body: ["Chính sách có thể được cập nhật. Chúng tôi khuyến nghị thỉnh thoảng kiểm tra ngày có hiệu lực."] },
      ],
      contactTitle: "Liên hệ",
      contactText: "Nếu bạn có câu hỏi về bảo vệ dữ liệu hoặc yêu cầu xóa, hãy liên hệ với quản trị viên dịch vụ: tkolymp.cz/kontakt",
      technicalNote: "Chi tiết kỹ thuật: triển khai xác thực và các cuộc gọi GraphQL có thể được tìm thấy trong AuthService và EventServices. Thông báo được quản lý bởi NotificationManagerService và Firebase Cloud Messaging. Bộ nhớ đệm ngoại tuyến được quản lý bởi OfflineSyncManager và OfflineDataStorage.",
      breadcrumbHome: "Trang chủ",
    },
  };

  const LANG_NAMES = { en: "English", cs: "Česky", de: "Deutsch", sk: "Slovensky", sl: "Slovenščina", uk: "Українська", vi: "Tiếng Việt" };

  function detectLang() {
    const p = new URLSearchParams(window.location.search).get('lang');
    if (p && CONTENT[p]) return p;
    const stored = localStorage.getItem('tkolymp-lang');
    if (stored && CONTENT[stored]) return stored;
    const bl = (navigator.language || 'en').split('-')[0];
    const mapped = bl === 'ua' ? 'uk' : bl;
    return CONTENT[mapped] ? mapped : 'en';
  }

  function applyLang(lang) {
    localStorage.setItem('tkolymp-lang', lang);
    const C = CONTENT[lang];

    document.getElementById('breadcrumbHome').textContent = C.breadcrumbHome;
    document.getElementById('breadcrumbCurrent').textContent = C.pageTitle;
    document.getElementById('pageTitle').textContent = C.pageTitle;
    document.getElementById('effectiveDate').textContent = C.effectiveDate;
    document.getElementById('summaryTitle').textContent = C.summaryTitle;
    document.getElementById('summaryText').textContent = C.summaryText;
    document.getElementById('contactTitle').textContent = C.contactTitle;
    document.getElementById('contactText').textContent = C.contactText;
    document.getElementById('technicalNote').textContent = C.technicalNote;
    document.getElementById('footerPrivacy').textContent = C.pageTitle;
    document.getElementById('footerTerms').textContent = lang === 'en' ? 'Terms of Use' : (CONTENT[lang] ? C.pageTitle === C.pageTitle : '');

    // Footer terms label per lang
    const termsLabels = { en: "Terms of Use", cs: "Podmínky používání", de: "Nutzungsbedingungen", sk: "Podmienky používania", sl: "Pogoji uporabe", uk: "Умови використання", vi: "Điều khoản sử dụng" };
    document.getElementById('footerTerms').textContent = termsLabels[lang] || "Terms of Use";

    document.getElementById('footerPrivacy').href = `../privacy/?lang=${lang}`;
    document.getElementById('footerTerms').href = `../terms/?lang=${lang}`;
    document.getElementById('breadcrumbHome').href = `../?lang=${lang}`;
    document.title = `${C.pageTitle} – TK Olymp`;

    // Render sections
    const container = document.getElementById('sections');
    container.innerHTML = '';
    C.sections.forEach(sec => {
      const div = document.createElement('div');
      div.className = 'doc-section';
      const h2 = document.createElement('h2');
      h2.className = 'section-title';
      h2.textContent = sec.title;
      div.appendChild(h2);
      const body = document.createElement('div');
      body.className = 'section-body';
      sec.body.forEach(line => {
        const p = document.createElement('p');
        p.textContent = line;
        body.appendChild(p);
      });
      div.appendChild(body);
      container.appendChild(div);
    });

    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    const url = new URL(window.location);
    url.searchParams.set('lang', lang);
    history.replaceState({}, '', url);
  }

  // Build lang switcher
  const switcher = document.getElementById('langSwitcher');
  Object.entries(LANG_NAMES).forEach(([code, name]) => {
    const btn = document.createElement('button');
    btn.className = 'lang-btn';
    btn.dataset.lang = code;
    btn.textContent = name;
    btn.onclick = () => applyLang(code);
    switcher.appendChild(btn);
  });

  applyLang(detectLang());
  </script>
</body>
</html>
